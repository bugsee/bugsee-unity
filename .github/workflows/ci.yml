name: CI

on:
  pull_request:
  push:
    branches:
      - cursor/upm-package-scaffold
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wrapper-policy:
    name: Wrapper policy tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test Tests~/WrapperPolicy/Bugsee.WrapperPolicy.Tests.csproj --nologo --configuration Release

  android:
    name: Android wrapper tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install Android platform
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          manager="$(find "$sdk/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          set +o pipefail
          yes | "$manager" --licenses >/dev/null || true
          "$manager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Test
        working-directory: Tests~/Android
        run: gradle :wrapper:testDebugUnitTest --no-daemon

  ios:
    name: iOS bridge tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        run: sh Tests~/iOS/run-tests.sh
