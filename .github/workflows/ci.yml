name: CI

on:
  pull_request:
  push:
    branches:
      - cursor/upm-package-scaffold
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wrapper-policy:
    name: Wrapper policy tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test Tests~/WrapperPolicy/Bugsee.WrapperPolicy.Tests.csproj --nologo --configuration Release

  windows-editor-path:
    name: Windows Editor path (native Windows host)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build the bugsee-cli.exe stand-in
        shell: pwsh
        run: |
          dotnet build Tests~/WindowsSmoke/FakeCli/FakeCli.csproj --nologo --configuration Release --output "$env:RUNNER_TEMP\fake-cli"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "BUGSEE_FAKE_CLI_EXE=$env:RUNNER_TEMP\fake-cli\bugsee-cli.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Everything except what is POSIX-only by design: the iOS classes (the Run Script and Xcode export run on a Mac, and
      # their tests drive /bin/sh and file modes) and LocalPackageCopy (/bin/cp, /bin/chmod).
      - name: Test
        shell: pwsh
        run: |
          dotnet test Tests~/WrapperPolicy/Bugsee.WrapperPolicy.Tests.csproj --nologo --configuration Release --filter 'FullyQualifiedName!~.Ios&FullyQualifiedName!~.LocalPackageCopyTests' --logger "trx;LogFileName=win.trx" --results-directory "$env:RUNNER_TEMP\trx"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # A skipped test counts as a pass: fail unless the native smoke tests really executed on this host.
      - name: Check that the Windows smoke tests ran
        shell: pwsh
        run: |
          [xml]$trx = Get-Content "$env:RUNNER_TEMP\trx\win.trx"
          $ids = @($trx.TestRun.TestDefinitions.UnitTest | Where-Object { $_.TestMethod.className -like '*WindowsNativeSmokeTests' } | ForEach-Object { $_.id })
          $r = @($trx.TestRun.Results.UnitTestResult | Where-Object { $ids -contains $_.testId })
          $passed = @($r | Where-Object { $_.outcome -eq 'Passed' }).Count
          Write-Host "Windows smoke tests passed: $passed of $($r.Count)"
          if ($passed -lt 12) { Write-Error "Expected at least 12 executed WindowsNativeSmokeTests results, got $passed"; exit 1 }

  wrapper-build-placeholder:
    name: Wrapper build id is the dev placeholder
    # Only a release branch carries a stamped id (Tools~/scripts/stamp-wrapper-build.sh); one merged into main would
    # make every later build report that release's hash.
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check
        run: bash Tools~/scripts/check-release-build.sh --dev

  # The iOS Run Script tests need PlistBuddy/shasum, which exist only on macOS; on the Linux job above they skip. They fail
  # (not skip) on macOS when a tool is missing, so this leg really runs them. Scoped to those classes to keep the macOS
  # runner short.
  wrapper-policy-macos:
    name: Wrapper policy tests (iOS Run Scripts, macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test Tests~/WrapperPolicy/Bugsee.WrapperPolicy.Tests.csproj --nologo --configuration Release --filter "FullyQualifiedName~IosSymbolUploadGateTests|FullyQualifiedName~IosBuildTokenFingerprintScriptTests|FullyQualifiedName~IosCliResolutionTests" --logger "trx;LogFileName=mac.trx" --results-directory "$RUNNER_TEMP/trx"

      # A renamed class would make the filter select nothing (a green no-op), and a skip counts as a pass: require every
      # class to have executed tests and none skipped.
      - name: Check that the iOS Run Script tests ran
        run: |
          python3 - "$RUNNER_TEMP/trx/mac.trx" <<'PY'
          import sys, collections
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          ns = {"t": root.tag.split("}")[0].strip("{")}
          cls = {u.get("id"): u.find("t:TestMethod", ns).get("className") for u in root.iterfind(".//t:UnitTest", ns)}
          counts = collections.defaultdict(collections.Counter)
          for r in root.iterfind(".//t:UnitTestResult", ns):
              counts[cls.get(r.get("testId"), "")][r.get("outcome")] += 1
          bad = False
          for name in ("IosSymbolUploadGateTests", "IosBuildTokenFingerprintScriptTests", "IosCliResolutionTests"):
              c = sum((v for k, v in counts.items() if k.split("(")[0].endswith("." + name)), collections.Counter())
              print(name, dict(c))
              if c["Passed"] == 0 or sum(c.values()) != c["Passed"]:
                  print("::error::" + name + " must have executed tests and none skipped or failed: " + str(dict(c)))
                  bad = True
          sys.exit(1 if bad else 0)
          PY

  unity-compile:
    name: Unity C# compile check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compile Runtime and Editor per Unity define set
        run: sh Tools~/scripts/compile-check.sh

  android:
    name: Android wrapper tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install Android platform
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          manager="$(find "$sdk/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          set +o pipefail
          yes | "$manager" --licenses >/dev/null || true
          "$manager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Test
        working-directory: Tests~/Android
        run: gradle :wrapper:testDebugUnitTest --no-daemon

  ios:
    name: iOS bridge tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        run: sh Tests~/iOS/run-tests.sh
