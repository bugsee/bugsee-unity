name: CI

on:
  pull_request:
  push:
    branches:
      - cursor/upm-package-scaffold
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wrapper-policy:
    name: Wrapper policy tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test Tests~/WrapperPolicy/Bugsee.WrapperPolicy.Tests.csproj --nologo --configuration Release

  windows-editor-path:
    name: Windows Editor path (native Windows host)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build the bugsee-cli.exe stand-in
        shell: pwsh
        run: |
          dotnet build Tests~/WindowsSmoke/FakeCli/FakeCli.csproj --nologo --configuration Release --output "$env:RUNNER_TEMP\fake-cli"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "BUGSEE_FAKE_CLI_EXE=$env:RUNNER_TEMP\fake-cli\bugsee-cli.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Everything except what is POSIX-only by design: the iOS classes (the Run Script and Xcode export run on a Mac, and
      # their tests drive /bin/sh and file modes) and LocalPackageCopy (/bin/cp, /bin/chmod).
      - name: Test
        shell: pwsh
        run: |
          dotnet test Tests~/WrapperPolicy/Bugsee.WrapperPolicy.Tests.csproj --nologo --configuration Release --filter 'FullyQualifiedName!~.Ios&FullyQualifiedName!~.LocalPackageCopyTests'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  unity-compile:
    name: Unity C# compile check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compile Runtime and Editor per Unity define set
        run: sh Tools~/scripts/compile-check.sh

  android:
    name: Android wrapper tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install Android platform
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          manager="$(find "$sdk/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          set +o pipefail
          yes | "$manager" --licenses >/dev/null || true
          "$manager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Test
        working-directory: Tests~/Android
        run: gradle :wrapper:testDebugUnitTest --no-daemon

  ios:
    name: iOS bridge tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        run: sh Tests~/iOS/run-tests.sh
